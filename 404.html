<style>
:root{color-scheme:light;--paper:#F5EFE3;--surface:#FCFAF4;--ink:#1D1913;--muted:#6C6355;--line:#E4DCC9;--accent:#A03B2A;
--serif:"Iowan Old Style","Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,SFMono-Regular,"Cascadia Code",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6}
header{border-bottom:2px solid var(--ink)}
.in{max-width:40rem;margin:0 auto;padding:1rem 1.25rem}
.brand{font-family:var(--serif);font-weight:700;font-size:1.6rem;letter-spacing:.02em;color:var(--ink);text-decoration:none}
.sub{margin:.25rem 0 0;font-family:var(--mono);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase}
h1{font-family:var(--serif);font-weight:600;font-size:1.7rem;line-height:1.3;margin:2rem 0 .5rem}
p{margin:.5rem 0}
.muted{color:var(--muted)}
form{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.25rem 0}
input{flex:1 1 14rem;min-height:44px;padding:.5rem .75rem;font:inherit;font-family:var(--mono);font-size:.9rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px}
button{min-height:44px;padding:.5rem 1rem;font-family:var(--mono);font-size:.85rem;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:3px;cursor:pointer}
button:hover{color:var(--surface);background:var(--accent)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
footer{margin-top:3rem;border-top:2px solid var(--ink);font-family:var(--mono);font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<header><div class="in"><a class="brand" href="/">IDEA RIPPER</a><p class="sub">the idea-hunting library</p></div></header>
<main class="in">
<h1>This page wasn’t ripped.</h1>

<form action="/" method="get" role="search">

<input id="q" name="q" type="search" placeholder="Search a problem: negotiation, hiring, delay…" autofocus/>

<p><a href="/">← Back to the library</a></p>

<footer><div class="in">machine-assisted, hand-curated &middot; <a href="/">idearipper.com</a></div></footer>
